# Test-coverage floor gate.
#
# Runs `./gradlew koverXmlReport` on every PR that touches feature/*,
# core/*, core-base/* sources or the floor file itself, then enforces
# per-module line-coverage floors via .kover-floor.yml.
#
# Floors only ratchet UPWARD over time as Phase 9 (PLAN-implement-universal)
# raises coverage on canonical-template modules. Lowering a floor requires an
# explicit justification in the PR description.

name: Test Coverage Floor

on:
  pull_request:
    paths:
      - 'feature/**'
      - 'core/**'
      - 'core-base/**'
      - '.kover-floor.yml'
      - 'scripts/check-coverage-floor.py'
      - 'build-logic/convention/src/main/kotlin/KoverConventionPlugin.kt'
      - 'build-logic/convention/src/main/kotlin/org/convention/Kover.kt'
      - '.github/workflows/test-coverage.yml'
  push:
    branches:
      - dev
      - master

concurrency:
  group: test-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Enforce per-module coverage floor
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/master' }}

      - name: Run kover aggregated XML report
        # `--continue` lets us harvest partial coverage even when a downstream
        # module's compile is broken; the floor-checker treats missing reports
        # as failures, so any silent-skip is still caught.
        run: ./gradlew koverXmlReport --continue --stacktrace
        continue-on-error: true

      - name: Check per-module floor
        run: python3 scripts/check-coverage-floor.py

      - name: Upload aggregated HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-html-report
          path: build/reports/kover/html/
          if-no-files-found: ignore
          retention-days: 14
