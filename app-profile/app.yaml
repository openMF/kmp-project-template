# app-profile/app.yaml — fork-owned white-label deployment SoT (COMMON, platform-agnostic).
#
# This is the SINGLE source of truth for all fork-owned deployment data (text + media).
# Edit HERE — never gradle/fork.properties (now a generated/fallback build-bridge).
# deployment/ reads this via deployment/_shared/config.rb (AppProfile.get).
# `sync-dirs.sh` NEVER rewrites app-profile/** (owner: fork in customization-surface.yaml).
#
# Platform-DIFFERENT values live in app-profile/platforms/<platform>/*.yaml — no duplication.

identity:
  app_id: org.mifos.kmp.template          # Mifos fork bundle id (SoT for appId; mirrored to gradle/libs.versions.toml)
  app_name: Mifos Money Toolkit           # app display name (Android app_name, iOS CFBundleDisplayName, settings footer)
  namespace: org.mifos.kmp.template       # mirrors app_id

# Per-flavor network endpoints + demo credentials + log tag. syncForkConfig emits these into
# gradle/fork.properties (network.base.url.{demo,prod} / demo.username / demo.password / log.tag),
# which KMPFlavorsConventionPlugin reads into per-flavor BuildConfig (BASE_URL / DEMO_USERNAME /
# DEMO_PASSWORD / LOG_TAG). Blank falls back to the template default baked into the plugin. (B4)
network:
  demo_base_url: https://demo.example.com   # PLACEHOLDER — fork sets its demo endpoint
  prod_base_url: https://api.example.com     # PLACEHOLDER — fork sets its prod endpoint
  demo_username: demo
  demo_password: demo
  log_tag: MifosMoneyToolkit
  # Declarative access-point topology — every REST + Supabase endpoint the app talks to, in ONE place.
  # This is the SoT for core/network's AccessPointRegistry: a fork declares its N endpoints here
  # (e.g. 3 REST + 2 Supabase), and ProjectNetworkModule wires each API in one line via
  # `restApi("<id>") { it.createXApi() }` — core/network auto-builds the transport from the id's
  # base_url + loggable_host. `type: rest | supabase`. (B3, epic pure-white-label-store5-network)
  access_points:
    - id: main
      type: rest
      base_url: https://api.example.com/
      loggable_host: api.example.com
    - id: staging
      type: rest
      base_url: https://staging.example.com/
      loggable_host: staging.example.com
    - id: supabase_data
      type: supabase
      base_url: https://project.supabase.co
      loggable_host: project.supabase.co
    # demo showcase REST endpoints — every server the toolkit actually talks to, wired in
    # ProjectNetworkModule via restApi("<id>") { it.createXApi() }.
    - id: jsonplaceholder            # WRITABLE, for the Store5 MUTABLE archetype
      type: rest
      base_url: https://jsonplaceholder.typicode.com/
      loggable_host: jsonplaceholder.typicode.com
    - id: frankfurter                # FX / currency exchange rates
      type: rest
      base_url: https://api.frankfurter.dev/
      loggable_host: api.frankfurter.dev
    - id: coingecko                  # crypto market data
      type: rest
      base_url: https://api.coingecko.com/
      loggable_host: api.coingecko.com
    - id: fred                       # US Federal Reserve economic data
      type: rest
      base_url: https://api.stlouisfed.org/
      loggable_host: api.stlouisfed.org
      proxied_host: api.stlouisfed.org   # blocks direct CORS calls → route via platform proxy
      secret_alias: template-fred-api-key # request-time API key — from the vault (secrets-manifest.yaml),
                                         # materialized to local.properties → BuildKonfig.FRED_API_KEY
    - id: worldbank                  # World Bank macro indicators
      type: rest
      base_url: https://api.worldbank.org/
      loggable_host: api.worldbank.org

