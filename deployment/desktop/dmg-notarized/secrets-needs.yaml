# deployment/desktop/dmg-notarized/secrets-needs.yaml
# Tier-2 — opt-in. Apple Developer ID Application cert required.
schema_version: "1.0"
target: desktop-dmg-notarized
dual_mode: true
required_for: [macos-signing]

vault_aliases:
  - alias: apple_developer_id_application_cert_p12
    canonical: "secrets/developer_id.p12"
    required_for: ["codesign"]
    materialize: { format: "file", via: "copy" }
  - alias: apple_developer_id_application_cert_password
    canonical: env:DEVELOPER_ID_CERT_PASSWORD
    required_for: ["keychain-import"]
    materialize: { format: "env", via: "export" }
  - alias: apple_developer_id_signing_identity
    canonical: env:DEVELOPER_ID_NAME
    required_for: ["codesign"]
    materialize: { format: "env", via: "export" }
  - alias: appstore_connect_api_key_p8
    canonical: "secrets/AuthKey.p8"
    required_for: ["notarytool"]
    materialize: { format: "file", via: "copy" }
  - alias: appstore_connect_key_id
    canonical: env:ASC_KEY_ID
    required_for: ["notarytool"]
    materialize: { format: "env", via: "export" }
  - alias: appstore_connect_issuer_id
    canonical: env:ASC_ISSUER_ID
    required_for: ["notarytool"]
    materialize: { format: "env", via: "export" }

manual_inputs:
  - canonical: "secrets/developer_id.p12"
    source_hint: "Apple Developer → Certificates → Developer ID Application (.p12 export)"
    placeholder: "<base64-p12>"
    gha_secret_var: "DEVELOPER_ID_CERT_B64"
  - canonical: env:DEVELOPER_ID_CERT_PASSWORD
    source_hint: "Password set when exporting the .p12 from Keychain"
    placeholder: "<p12-password>"
    gha_secret_var: "DEVELOPER_ID_CERT_PASSWORD"
  - canonical: env:DEVELOPER_ID_NAME
    source_hint: "Full common name e.g. 'Developer ID Application: Mifos Initiative (TEAMID)'"
    placeholder: "Developer ID Application: <Org> (<TEAMID>)"
    gha_secret_var: "DEVELOPER_ID_NAME"
  - canonical: "secrets/AuthKey.p8"
    source_hint: "App Store Connect → Users and Access → Keys"
    placeholder: "<base64-p8>"
    gha_secret_var: "APPSTORE_AUTH_KEY_B64"
  - canonical: env:ASC_KEY_ID
    source_hint: "App Store Connect key id (10-char alphanumeric)"
    placeholder: "<key-id>"
    gha_secret_var: "ASC_KEY_ID"
  - canonical: env:ASC_ISSUER_ID
    source_hint: "App Store Connect issuer id (UUID)"
    placeholder: "<issuer-id>"
    gha_secret_var: "ASC_ISSUER_ID"
