# .github/workflows/security-scan.yml — v2 security gate
#
# SBOM + dependency vuln scan + gitleaks. Runs on PRs + nightly cron.
name: Security Scan
run-name: "🔒 Security Scan · ${{ github.event.pull_request.title || github.ref_name }}"

on:
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 2 * * *'   # nightly 02:00 UTC
  workflow_dispatch:

jobs:
  scan:
    uses: openMF/mifos-x-actionhub/.github/workflows/security-scan-v2.yaml@v1.0.21
    with:
      fail_on_vuln_severity: 'high'
      sbom_format:           'cyclonedx-json'
    secrets: inherit
