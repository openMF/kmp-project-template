# .github/workflows/pr-check.yml — v2 multi-platform PR validation
#
# Runs Android + iOS + Desktop + Web checks in parallel on every PR + push to main/dev.
#
# iOS is invoked LOCALLY (not via actionhub) because the actionhub's reusable
# workflow calls `:cmp-shared:compileKotlin` which doesn't exist in modern KMP —
# the task is ambiguous (resolves to compileKotlinIosArm64, compileKotlinJs, etc.).
# We route iOS through a thin local job that calls the correct platform task.
# Track removal of this local override at: openMF/mifos-x-actionhub PR (TBD).
name: PR Check
run-name: "🔍 PR Check · #${{ github.event.pull_request.number || github.ref_name }} · ${{ github.event.pull_request.title || github.event.head_commit.message }}"

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  validate:
    uses: openMF/mifos-x-actionhub/.github/workflows/pr-check-v2.yaml@v1.0.21
    with:
      # iOS handled locally below (actionhub iOS step is broken on KMP).
      platforms:            'android,desktop,web'
      android_package_name: cmp-android
      ios_package_name:     cmp-ios
      shared_module:        cmp-shared
      desktop_package_name: cmp-desktop
      web_package_name:     cmp-web
    secrets: inherit

  ios:
    name: PR Check · iOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '15.2' }
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Generate podspec + placeholder framework
        # podspec has a raise-if-missing check on
        # build/cocoapods/framework/ComposeApp.framework. generateDummyFramework
        # produces a placeholder so `pod install` passes; xcodebuild's
        # script_phase later swaps in the real framework via syncFramework.
        run: ./gradlew :cmp-shared:podspec :cmp-shared:generateDummyFramework
      - name: Build iOS (unsigned) via canonical fastlane lane
        # fastlane ios build_ios is the canonical PR-check lane. It runs
        # cocoapods + build_ios_app(skip_codesigning: true, skip_archive: true)
        # — the same path the actionhub action would invoke.
        run: bundle exec fastlane ios build_ios
