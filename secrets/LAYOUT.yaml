# secrets/LAYOUT.yaml — SINGLE SOURCE OF TRUTH for the secrets *layout/contract*.
#
# This is the ONLY place the on-disk secrets structure is declared. Every reader
# (config.rb, Fastlane lanes, firebase_helpers.rb) and every writer (the GitHub
# Actions pre_fastlane_script, `/secrets pull`) resolves through `build-secrets`,
# which reads this file. Reorganize secrets/ → edit THIS file; code + workflows
# never change.
#
# Values are NOT here — those live in the vault (mirrored to GitHub Secrets +
# materialized into secrets/live/ at runtime). This file only declares WHERE/HOW.
#
# Resolution: `precedence` roots are tried in order; the first existing file wins
# (live real secrets beat committed sample fakes). Phase 7 decouple step keeps
# both roots = `secrets` (today's flat layout); the restructure step flips them
# to secrets/live + secrets/sample.
#
# Secret kinds:
#   file   + encoding base64|pem-or-base64|plain → decoded to a file
#   value                                         → env-first string, file fallback
#   literal (value:)                              → constant string written to a file
#   env_var                                       → env-line; materialized to _env/<VAR>
# Optional per-secret keys: consume_at (out-of-tree read path), mode (chmod octal),
#   by_flavor (per-flavor source_env/rel override), {flavor}/{variant} in rel/consume_at.
version: 1
roots:
  live: secrets/live      # REAL secrets — gitignored; materialized in CI / by `/secrets pull`
  sample: secrets/sample  # committed structurally-valid fakes (no-creds fallback)
precedence: [live, sample]

secrets:
  # ── kind: file / base64 ────────────────────────────────────────────────────
  firebase_service_account:
    vault_alias: mifos-x-firebase-service-account-json
    kind: file
    encoding: base64
    source_env: FIREBASE_CREDS_B64
    rel: android/firebase/firebaseAppDistributionServiceCredentialsFile.json
    mode: "0600"
  play_service_account:
    vault_alias: mifos-x-play-publisher-service-account-json
    kind: file
    encoding: base64
    source_env: PLAYSTORE_CREDS_B64
    rel: android/play/playStorePublishServiceCredentialsFile.json
    mode: "0600"
  upload_keystore:
    vault_alias: kmp-project-template-upload-keystore
    kind: file
    encoding: base64
    source_env: UPLOAD_KEYSTORE_B64
    rel: android/keystores/upload_keystore.keystore
    mode: "0600"
  # Signing creds materialize as the .properties FILE config.rb#get_android_signing_config reads
  # (single source of truth, platform-wise path — NOT scattered _env vars). Every key is vault-backed;
  # heals the dropped-signing-creds gap (RULE-SECRETS-KEYSTORE-PROPS-001 / SL6). The `properties` kind
  # assembles KEY=VALUE from vault-backed keys (value ← ENV[source_env], set by the pull's LAYOUT pass).
  upload_keystore_properties:
    kind: properties
    rel: android/keystores/upload_keystore.properties
    mode: "0600"
    keys:
      - { name: storePassword, source_env: KEYSTORE_PASSWORD,       vault_alias: kmp-project-template-upload-keystore-storepass }
      - { name: keyAlias,      source_env: KEYSTORE_ALIAS,          vault_alias: kmp-project-template-upload-keystore-keyalias }
      - { name: keyPassword,   source_env: KEYSTORE_ALIAS_PASSWORD, vault_alias: kmp-project-template-upload-keystore-keypass }
      - { name: storeFile,     source_env: KEYSTORE_STORE_FILE,     vault_alias: kmp-project-template-upload-keystore-storefile }
  mifos-x-google-services:
    vault_alias: mifos-x-google-services
    kind: file
    encoding: base64
    source_env: GOOGLE_SERVICES_B64
    rel: android/google-services.json
    consume_at: cmp-android/google-services.json   # gradle google-services plugin reads it here
  mac_app_store_cert:
    kind: file
    encoding: base64
    source_env: MAC_APP_STORE_CERT_P12_B64
    rel: desktop/macos/app_store.p12
    mode: "0600"
  mac_installer_cert:
    kind: file
    encoding: base64
    source_env: MAC_INSTALLER_CERT_P12_B64
    rel: desktop/macos/installer.p12
    mode: "0600"

  # ── kind: file / pem-or-base64 (raw PEM passthrough OR base64 decode) ───────
  appstore_auth_key:
    vault_alias: mifos-x-appstore-private-key-p8
    kind: file
    encoding: pem-or-base64
    source_env: APPSTORE_AUTH_KEY_B64
    rel: apple/appstore/AuthKey.p8
    mode: "0600"
  match_ssh_key:
    vault_alias: mifos-x-match-git-ssh-private-key
    kind: file
    encoding: pem-or-base64
    source_env: MATCH_GIT_PRIVATE_KEY
    rel: apple/match/match_ci_key
    mode: "0600"

  # ── kind: literal (constant → file) ────────────────────────────────────────
  match_git_url:
    kind: literal
    value: "git@github.com:openMF/ios-provisioning-profile.git"
    rel: apple/match/git_url
  match_git_branch:
    # Branch in the Match certificate repo. Single source of truth is `dev` — the
    # openMF/ios-provisioning-profile repo default branch. Forks override per-app if needed.
    kind: literal
    value: "dev"
    rel: apple/match/git_branch

  # ── kind: value (env-first, file fallback) ─────────────────────────────────
  # FLAVOR-AWARE: prod vs demo diverge today (different Firebase App IDs) → by_flavor.
  mifos-x-firebase-android-app-id:
    kind: value
    by_flavor:
      prod: { source_env: FIREBASE_ANDROID_APP_ID,      rel: android/firebase/android_app_id, vault_alias: mifos-x-firebase-android-app-id }
      demo: { source_env: FIREBASE_ANDROID_DEMO_APP_ID, rel: android/firebase/android_demo_app_id, vault_alias: mifos-x-firebase-android-demo-app-id }
  # iOS Firebase App IDs — read by config.rb `_secret_file("apple/firebase/ios_*")`
  # (ENV → fork.properties → vault-file fallback chain, lines 248-262). Three distinct
  # keys (not by_flavor): prod tries ios_prod_app_id then ios_app_id; demo uses
  # ios_demo_app_id. All three vaulted; short aliases resolve to the mifos-x-…-ios-* ids.
  mifos-x-firebase-ios-app-id:
    vault_alias: mifos-x-firebase-ios-app-id
    kind: value
    source_env: FIREBASE_IOS_APP_ID
    rel: apple/firebase/ios_app_id
  mifos-x-firebase-ios-prod-app-id:
    vault_alias: mifos-x-firebase-ios-prod-app-id
    kind: value
    source_env: FIREBASE_IOS_PROD_APP_ID
    rel: apple/firebase/ios_prod_app_id
  mifos-x-firebase-ios-demo-app-id:
    vault_alias: mifos-x-firebase-ios-demo-app-id
    kind: value
    source_env: FIREBASE_IOS_DEMO_APP_ID
    rel: apple/firebase/ios_demo_app_id
  mifos-x-appstore-key-id:
    vault_alias: mifos-x-appstore-key-id
    kind: value
    source_env: APPSTORE_KEY_ID
    rel: apple/appstore/key_id
  appstore_issuer_id:
    vault_alias: mifos-x-appstore-key-issuer-id
    kind: value
    source_env: APPSTORE_ISSUER_ID
    rel: apple/appstore/issuer_id

  # ── kind: env_var (env-line → _env/<VAR>; consumed as env on CI) ────────────
  mifos-x-match-password:               { kind: env_var, source_env: MATCH_PASSWORD, vault_alias: mifos-x-match-password }
  azure_ts_account_name:        { kind: env_var, source_env: AZURE_TS_ACCOUNT_NAME }
  azure_ts_cert_profile_name:   { kind: env_var, source_env: AZURE_TS_CERT_PROFILE_NAME }
  azure_ts_client_id:           { kind: env_var, source_env: AZURE_TS_CLIENT_ID }
  azure_ts_subscription_id:     { kind: env_var, source_env: AZURE_TS_SUBSCRIPTION_ID }
  azure_ts_tenant_id:           { kind: env_var, source_env: AZURE_TS_TENANT_ID }
  mifos-x-cloudflare-account-id:        { kind: env_var, source_env: CLOUDFLARE_ACCOUNT_ID, vault_alias: mifos-x-cloudflare-account-id }
  mifos-x-cloudflare-pages-api-token:   { kind: env_var, source_env: CLOUDFLARE_PAGES_API_TOKEN, vault_alias: mifos-x-cloudflare-pages-api-token }
  github_release_upload_token:  { kind: env_var, source_env: GH_TOKEN }
  # Microsoft Store (Desktop Windows MSIX → Store). All 7 are vault-managed (single
  # SoT, auto-synced); only the client secret is sensitive. gradle/fork.properties
  # windows.* keys (same ENV names) are the OSS-fork fallback.
  mifos-x-ms-app-id:                          { kind: env_var, source_env: MS_APP_ID, vault_alias: mifos-x-ms-app-id }
  mifos-x-ms-partner-center-tenant-id:        { kind: env_var, source_env: MS_PARTNER_CENTER_TENANT_ID }
  mifos-x-ms-partner-center-client-id:        { kind: env_var, source_env: MS_PARTNER_CENTER_CLIENT_ID }
  mifos-x-ms-partner-center-client-secret:    { kind: env_var, source_env: MS_PARTNER_CENTER_CLIENT_SECRET }
  mifos-x-windows-msix-identity-name:         { kind: env_var, source_env: WINDOWS_MSIX_IDENTITY_NAME, vault_alias: mifos-x-windows-msix-identity-name }
  mifos-x-windows-msix-publisher:             { kind: env_var, source_env: WINDOWS_MSIX_PUBLISHER, vault_alias: mifos-x-windows-msix-publisher }
  mifos-x-windows-msix-publisher-display-name: { kind: env_var, source_env: WINDOWS_MSIX_PUBLISHER_DISPLAY_NAME, vault_alias: mifos-x-windows-msix-publisher-display-name }
  mifos-x-netlify-auth-token:           { kind: env_var, source_env: NETLIFY_AUTH_TOKEN, vault_alias: mifos-x-netlify-auth-token }
  mifos-x-netlify-site-id:              { kind: env_var, source_env: NETLIFY_SITE_ID, vault_alias: mifos-x-netlify-site-id }
  mifos-x-vercel-org-id:                { kind: env_var, source_env: VERCEL_ORG_ID, vault_alias: mifos-x-vercel-org-id }
  mifos-x-vercel-project-id:            { kind: env_var, source_env: VERCEL_PROJECT_ID, vault_alias: mifos-x-vercel-project-id }
  mifos-x-vercel-token:                 { kind: env_var, source_env: VERCEL_TOKEN, vault_alias: mifos-x-vercel-token }
