# .github/workflows/pr-check.yml — v2 multi-platform PR validation
#
# Runs Android + iOS + Desktop + Web checks in parallel on every PR + push to main/dev.
#
# iOS is invoked LOCALLY (not via actionhub) because the actionhub's reusable
# workflow calls `:cmp-shared:compileKotlin` which doesn't exist in modern KMP —
# the task is ambiguous (resolves to compileKotlinIosArm64, compileKotlinJs, etc.).
# We route iOS through a thin local job that calls the correct platform task.
# Track removal of this local override at: openMF/mifos-x-actionhub PR (TBD).
name: PR Check
run-name: "🔍 PR Check · #${{ github.event.pull_request.number || github.ref_name }} · ${{ github.event.pull_request.title || github.event.head_commit.message }}"

# Cancel superseded runs: a newer commit on the same PR/branch cancels the older, still-running
# PR-check instead of letting them pile up and hold scarce macOS runners ~50 min each (the
# "runs in bunches → grabs many runners and holds them" problem the dev team flagged). This is
# workflow-level so it covers BOTH the reusable `validate` call AND the local `ios` job —
# one commit on a branch = at most one live run of this workflow.
concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  validate:
    uses: openMF/mifos-x-actionhub/.github/workflows/pr-check-v2.yaml@v1.0.21
    with:
      # iOS handled locally below (actionhub iOS step is broken on KMP).
      platforms:            'android,desktop,web'
      android_package_name: cmp-android
      ios_package_name:     cmp-ios
      shared_module:        cmp-shared
      desktop_package_name: cmp-desktop
      web_package_name:     cmp-web
    secrets: inherit

  ios:
    # macos-15 (arm64) is the image PR #185 (Jun 3, last green iOS) ran on. It
    # ships Xcode 26.0.1 which has the iOS 26 SDK — the iOS 26 SDK exports
    # _OBJC_CLASS_$_UIViewLayoutRegion that compose-multiplatform 1.11.x's
    # CMPLayoutRegion references. The earlier macos-14 image ships Xcode 16.1
    # max (iOS 18 SDK) which does NOT export the symbol → link fails. Per
    # actions/runner-images macos-15-arm64-Readme.md, Xcode 26.0/26.1/26.2/26.3
    # are all available on macos-15. (macos-14 deprecation begins 2026-07-06.)
    name: PR Check · iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
      - uses: maxim-lobanov/setup-xcode@v1
        # Xcode 26.0 = exact pin PR #185's actionhub action used (the action
        # source comments "Builds on PR #47 (Xcode 26 fix, currently shipped
        # as v1.0.13)"). Resolves to 26.0.1 on macos-15.
        with: { xcode-version: '26.0' }
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      # Cache the Kotlin/Native toolchain + platform klibs (~/.konan). A cold iOS K/N compile is the
      # single biggest cost of this job; setup-gradle caches ~/.gradle but NOT ~/.konan. Keyed on the
      # version catalog so a Kotlin bump busts it.
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      # Cache resolved SwiftPM clones (the native Firebase SDK graph, ~14 packages) so xcodebuild's
      # -resolvePackageDependencies / -showBuildSettings don't re-clone the world every run.
      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('cmp-ios/**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: fastlane ios build_ios (unsigned)
        # Canonical PR-check lane in fastlane/Fastfile — it ALREADY assembles the DEBUG ComposeApp
        # XCFramework (assembleComposeAppDebugXCFramework) and builds the prodDebug scheme unsigned.
        # We deliberately do NOT pre-assemble a RELEASE XCFramework in a separate step: a debug PR
        # check never links it, so that was ~1h of Kotlin/Native optimize-compile thrown away.
        env:
          # `xcodebuild -showBuildSettings` must evaluate the iosApp SwiftPM graph (the native
          # Firebase SDK added in E6) on a cold runner — Fastlane's default 3s base × 4 retries
          # times out even though the build itself succeeds. Give the settings probe real headroom.
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: '120'
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: '5'
        run: bundle exec fastlane ios build_ios
