# .github/workflows/quality-gate.yml — v2 combined quality suite
#
# Coverage + Spotless + Detekt + Dependency Guard + SBOM.
# Runs on every PR + on tag creation.
name: Quality Gate
run-name: "✅ Quality Gate · ${{ github.event.pull_request.title || github.ref_name }}"

on:
  pull_request:
    branches: [main, dev]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    uses: openMF/mifos-x-actionhub/.github/workflows/quality-gate-v2.yaml@v1.0.21
    with:
      coverage_threshold: '0.50'   # bump as coverage grows; floor for now
      sbom_format:        'cyclonedx-json'
      fail_on_warnings:   false
    secrets: inherit
