# Verify every `libs.<name>` reference inside `build-logic/` resolves to an alias
# declared in `gradle/libs.versions.toml`. Triggered on PRs touching either of
# those paths.
#
# The companion script is `scripts/verify_libs_resolved.sh`. Both ship to consumer
# forks via the `sync-dirs.yaml` workflow (`.github/` + `scripts/` are in the
# default sync list), so every fork gets the same guarantee with zero per-fork
# configuration.
#
# Why this gate exists:
#   When `build-logic/` is auto-synced into a consumer fork but the consumer's
#   `gradle/libs.versions.toml` is NOT (it carries project-local package names +
#   version overrides), build-logic ends up referencing aliases that don't exist
#   in the consumer's catalog. This produces a silent broken state — gradle won't
#   complain until the alias is actually evaluated by a downstream build, hours
#   to weeks after the bad sync ran. This gate fires at PR time and surfaces the
#   class of failure immediately.

name: Verify build-logic ↔ libs.versions.toml resolution

on:
  pull_request:
    paths:
      - 'build-logic/**'
      - 'gradle/libs.versions.toml'
      - 'scripts/verify_libs_resolved.sh'
      - '.github/workflows/verify-libs-resolved.yml'
  push:
    branches: [dev]
    paths:
      - 'build-logic/**'
      - 'gradle/libs.versions.toml'
      - 'scripts/verify_libs_resolved.sh'
      - '.github/workflows/verify-libs-resolved.yml'

concurrency:
  group: verify-libs-resolved-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Resolve build-logic libs.* against catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run resolution gate
        run: bash scripts/verify_libs_resolved.sh
