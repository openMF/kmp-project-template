# to re-sign your AAB after upload verification).
#
# Generate via:
#   ./keystore-manager.sh generate
# OR manually:
#   keytool -genkey -keystore secrets/keystores/original_keystore.keystore \
#     -alias original -keyalg RSA -keysize 4096 -validity 25000
#
# ⚠️  LOSE THIS = CANNOT UPDATE APP UNDER SAME PACKAGE NAME.
# Back up to password manager + encrypted cloud + another team member.
storeFile=original_keystore.keystore
storePassword=PLACEHOLDER_ORIGINAL_STORE_PASSWORD
keyAlias=original
keyPassword=PLACEHOLDER_ORIGINAL_KEY_PASSWORD
