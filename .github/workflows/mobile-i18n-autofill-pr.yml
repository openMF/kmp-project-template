name: Mobile i18n Autofill (bot PR)

on:
  # Changed from pull_request to pull_request_target for write access
  pull_request_target:
    branches: [dev]
    paths:
      - 'cmp-android/**'
      - 'feature/**'
      - '.github/workflows/mobile-i18n-autofill-pr.yml'
      - 'translate.py'

permissions:
  contents: write
  pull-requests: write

jobs:
  i18n-autofill:
    runs-on: ubuntu-latest
    # Added an environment for an extra layer of protection if needed
    steps:
      - name: Checkout Forked PR
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai lxml

      - name: Run translation autofill
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # The script is now running on the code from the fork
          python translate.py \
            --mode apply \
            --locales "ar,bn,de,en,es,fa,fr,gu,hi,hu,id,km,kn,ml,mr,ms,my,pl,pt,ru,si,sw,te,ur" \
            --model "gemma-3-27b-it" \
            --batch-size 15 \
            --request-delay 2

      - name: Validate Android resources compile
        run: |
          ./gradlew :cmp-android:processDemoDebugResources

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add cmp-android/ feature/
          
          # Only commit and push if there are actual changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-generate mobile i18n translations"
            # Since checkout was done with GITHUB_TOKEN, origin is authenticated
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            echo "No translation changes detected."
          fi
          
