# =============================================================================
# secrets-manifest.yaml — mifos-x/kmp-project-template
# =============================================================================
#
# Schema-bootstrap only — values pending `/secrets adopt --apply` by vault admin.
# Real secret values are NEVER stored in this file. Each `needs[].alias` row
# resolves through:
#   alias → core/registries/SECRETS_ALIAS_REGISTRY.yaml
#         → (vault, secret_id)
#         → SOPS+age decrypt → materialize.at path
#
# Authority: RULE-SECRETS-VAULT-001 (SV1, SV2, SV10), RULE-SECRETS-ALIAS-REGISTRY-001 (SAR10)
# Schema: v2.0 (unified alias namespace, 2026-05-30)
# Adoption phase: fastlane-modernization-02-secrets-adopt-and-bridge
# =============================================================================

schema_version: "2.0"
project: mifos-x/kmp-project-template

# ── Default account email for cross-vault reuse keying (SV22) ────────────────
# Override per-alias by adding `account_email:` on the alias's REGISTRY row.
default_account_email: null

needs:
  # ── Android signing (release keystore + password) ──────────────────────────
  - alias: kmp_template_release_keystore
    materialize:
      at: secrets/keystores/release.jks
      mode: file
      permissions: "0600"

  - alias: kmp_template_release_keystore_password
    materialize:
      at: secrets/keystores/release.properties
      mode: env-line
      env_var: KEYSTORE_PASSWORD

  # ── Google Play Console publish + Firebase App Distribution ───────────────
  # SINGLE SA at secrets/play/service-account.json serves BOTH purposes
  # (Play Console upload AND Firebase App Distribution). The legacy
  # `firebase_service_account_json` alias + separate file at
  # secrets/firebase/service-account.json was retired 2026-06-19 per
  # consolidation directive. The play SA needs `Firebase App Distribution
  # Admin` role added in IAM for the Firebase project.
  - alias: play_publisher_service_account_json
    materialize:
      at: secrets/play/service-account.json
      mode: file
      permissions: "0600"

  # ── Apple App Store Connect API key (3 components) ─────────────────────────
  - alias: appstore_key_id
    materialize:
      at: secrets/appstore/key_id
      mode: env-line
      env_var: APPSTORE_KEY_ID

  - alias: appstore_key_issuer_id
    materialize:
      at: secrets/appstore/issuer_id
      mode: env-line
      env_var: APPSTORE_ISSUER_ID

  - alias: appstore_private_key_p8
    materialize:
      at: secrets/appstore/AuthKey.p8
      mode: file
      permissions: "0600"

  # ── Fastlane Match (cert repo SSH key + encryption password) ───────────────
  - alias: match_git_ssh_private_key
    materialize:
      at: secrets/match/match_ci_key
      mode: file
      permissions: "0600"

  - alias: match_password
    materialize:
      at: secrets/match/.match_password
      mode: env-line
      env_var: MATCH_PASSWORD

  # ── Cloudflare Pages (web publish) ─────────────────────────────────────────
  - alias: cloudflare_pages_api_token
    materialize:
      at: secrets/cloudflare/api_token
      mode: env-line
      env_var: CLOUDFLARE_API_TOKEN

  - alias: cloudflare_account_id
    materialize:
      at: secrets/cloudflare/account_id
      mode: env-line
      env_var: CLOUDFLARE_ACCOUNT_ID

  # ── Netlify (web publish) ──────────────────────────────────────────────────
  - alias: netlify_auth_token
    materialize:
      at: secrets/netlify/auth_token
      mode: env-line
      env_var: NETLIFY_AUTH_TOKEN

  - alias: netlify_site_id
    materialize:
      at: secrets/netlify/site_id
      mode: env-line
      env_var: NETLIFY_SITE_ID

  # ── Vercel (web publish) ───────────────────────────────────────────────────
  - alias: vercel_token
    materialize:
      at: secrets/vercel/token
      mode: env-line
      env_var: VERCEL_TOKEN

  - alias: vercel_org_id
    materialize:
      at: secrets/vercel/org_id
      mode: env-line
      env_var: VERCEL_ORG_ID

  - alias: vercel_project_id
    materialize:
      at: secrets/vercel/project_id
      mode: env-line
      env_var: VERCEL_PROJECT_ID
