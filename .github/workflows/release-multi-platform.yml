# .github/workflows/release-multi-platform.yml
#
# Thin wrapper → openMF/mifos-x-actionhub/.github/workflows/v2/release-multi-platform.yaml@v1.0.19
# All orchestration logic — per-platform target dropdowns, auto-version_tag,
# parallel firebase+internal / firebase+testflight fan-out, smart defaults —
# lives in the centralized reusable workflow. This file only declares the
# workflow_dispatch inputs the consumer exposes + maps secrets.
#
# Default mode (touch nothing in the Run workflow form):
#   Android  → Firebase Distribution + Play Internal     (parallel)
#   iOS      → Firebase Distribution + TestFlight        (parallel)
#   macOS    → Mac TestFlight                            (Stage 1)
#   Windows  → GH Pre-release                            (Stage 1-equivalent)
#   Linux    → GH Pre-release                            (Stage 1-equivalent)
#   Web      → Preview deploy                            (Stage 1)
#   version_tag → auto-computed YYYY.M.D
#
# Per-platform skip: set `<platform>_target: skip`.
# Promote via re-dispatch with a higher rung.
name: Release · Multi-Platform
run-name: "🚀 Release ${{ inputs.version_tag || format('auto-{0}', github.run_number) }} · Android=${{ inputs.android_target }} · iOS=${{ inputs.ios_target }}"

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (leave EMPTY to auto-compute YYYY.M.D)'
        required: false
        type: string
        default: ''

      android_target:
        description: 'Android'
        required: false
        type: choice
        options: [firebase+internal, firebase, internal, beta, production, skip]
        default: firebase+internal

      ios_target:
        description: 'iOS'
        required: false
        type: choice
        options: [firebase+testflight, firebase, internal, beta, production, skip]
        default: firebase+testflight

      mac_target:
        description: 'macOS MAS'
        required: false
        type: choice
        options: [internal, beta, production, skip]
        default: internal

      desktop_win_target:
        description: 'Windows'
        required: false
        type: choice
        options: [prerelease, beta, stable, skip]
        default: prerelease

      desktop_win_artifact:
        description: 'Windows artifact format'
        required: false
        type: choice
        options: [windows-msi-signed, windows-exe, windows-microsoft-store]
        default: windows-msi-signed

      desktop_linux_target:
        description: 'Linux DEB'
        required: false
        type: choice
        options: [prerelease, beta, stable, skip]
        default: prerelease

      web_target:
        description: 'Web'
        required: false
        type: choice
        options: [preview, staging, production, skip]
        default: preview

      web_host:
        description: 'Web host provider'
        required: false
        type: choice
        options: [gh-pages, cloudflare-pages, netlify, vercel]
        default: gh-pages

      production_rollout:
        description: 'Android staged rollout (0.0-1.0, only used when android_target=production)'
        required: false
        type: string
        default: '0.10'

jobs:
  release:
    name: Release
    uses: openMF/mifos-x-actionhub/.github/workflows/v2/release-multi-platform.yaml@v1.0.19
    with:
      version_tag:          ${{ inputs.version_tag }}
      android_package_name: cmp-android
      ios_package_name:     cmp-ios
      mac_package_name:     cmp-desktop
      shared_module:        cmp-shared
      desktop_package_name: cmp-desktop
      web_package_name:     cmp-web
      android_target:       ${{ inputs.android_target }}
      ios_target:           ${{ inputs.ios_target }}
      mac_target:           ${{ inputs.mac_target }}
      desktop_win_target:   ${{ inputs.desktop_win_target }}
      desktop_win_artifact: ${{ inputs.desktop_win_artifact }}
      desktop_linux_target: ${{ inputs.desktop_linux_target }}
      web_target:           ${{ inputs.web_target }}
      web_host:             ${{ inputs.web_host }}
      production_rollout:   ${{ inputs.production_rollout }}
    secrets:
      google_services:          ${{ secrets.GOOGLESERVICES }}
      firebase_creds:           ${{ secrets.FIREBASECREDS }}
      playstore_creds:          ${{ secrets.PLAYSTORECREDS }}
      upload_keystore:          ${{ secrets.UPLOAD_KEYSTORE_FILE }}
      keystore_password:        ${{ secrets.UPLOAD_KEYSTORE_FILE_PASSWORD }}
      keystore_alias:           ${{ secrets.UPLOAD_KEYSTORE_ALIAS }}
      keystore_alias_password:  ${{ secrets.UPLOAD_KEYSTORE_ALIAS_PASSWORD }}
      appstore_key_id:          ${{ secrets.APPSTORE_KEY_ID }}
      appstore_issuer_id:       ${{ secrets.APPSTORE_ISSUER_ID }}
      appstore_auth_key:        ${{ secrets.APPSTORE_AUTH_KEY }}
      match_password:           ${{ secrets.MATCH_PASSWORD }}
      match_ssh_private_key:    ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
