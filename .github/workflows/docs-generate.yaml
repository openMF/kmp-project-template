name: Generate and Publish Documentation

# Workflow to generate Dokka documentation and push to docs repository
# This workflow runs on push to main/dev branch or can be triggered manually

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'core/**'
      - 'feature/**'
      - 'cmp-*/**'
      - 'docs-generator/**'
      - '.github/workflows/docs-generate.yaml'
  
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'core/**'
      - 'feature/**'
      - 'cmp-*/**'
      - 'docs-generator/**'
  
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:
  generate-documentation:
    name: Generate Documentation
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better documentation links
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      
      # Generate Dokka documentation
      - name: Generate Dokka Documentation
        run: ./gradlew dokkaGenerate -x :cmp-web:dokkaGenerate --no-daemon --stacktrace
        continue-on-error: false
      
      # Organize documentation (PR merge path): update latest per-module only
      - name: Organize Documentation Output (latest only, per module)
        run: |
          set -euo pipefail

          mkdir -p docs-website/static/api/latest

          echo "Copying Dokka documentation into latest per-module folders"
          while IFS= read -r dokkaDir; do
            moduleDir="$(dirname "$(dirname "$dokkaDir")")"
            moduleName="$(basename "$moduleDir")"
            mkdir -p "docs-website/static/api/latest/${moduleName}"
            rsync -a --delete "$dokkaDir"/ "docs-website/static/api/latest/${moduleName}"/
          done < <(find . -path "*/build/dokka/html" -type d)

          # Optional root Dokka output if present
          if [ -d "build/dokka/html" ]; then
            mkdir -p "docs-website/static/api/latest/root"
            rsync -a --delete build/dokka/html/ "docs-website/static/api/latest/root/"
          fi

          # GitHub Pages needs .nojekyll
          touch "docs-website/static/api/latest/.nojekyll"

          echo "Documentation (latest) organized successfully!"
          ls -la "docs-website/static/api/latest" || true

      # Commit and push Dokka docs to docs-website on dev branch
      - name: Commit and Push Dokka Docs to docs-website
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs-website/static/api
          if git diff --staged --quiet; then
            echo "No documentation changes to commit."
          else
            git commit -m "docs: update Dokka API docs [skip ci]"
            git push origin dev
          fi
      
      # Skip publishing on PR merge path; publishing happens in release workflow
      
      # Summary
      - name: Generate Summary
        if: always()
        run: |
          echo "### Documentation Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dokka (Kotlin API Docs) | Generated |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${GITHUB_REF_NAME}\`" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Documentation artifact uploaded and available for 30 days" >> $GITHUB_STEP_SUMMARY
          fi


