name: iOS/macOS Certificate Renewal
run-name: "ios-cert-renewal · ${{ github.ref_name }}"

# CI wrapper that runs cert-renewal.sh from its CANONICAL home:
#   github.com/openMF/ios-provisioning-profile/cert-renewal.sh
#
# The script is the single source of truth for renewal logic.
# Run the same script locally without GitHub Actions:
#
#   git clone git@github.com:openMF/ios-provisioning-profile.git
#   cd ios-provisioning-profile
#   # place secrets in secrets/ or export ENV vars (see script header for details)
#   bash cert-renewal.sh --force
#   bash cert-renewal.sh --type mac_installer_distribution
#
# Cert inventory in openMF/ios-provisioning-profile:
#
#   TYPE                         PLATFORM  COVERS
#   appstore                     iOS       TestFlight + App Store
#   adhoc                        iOS       Firebase App Distribution
#   appstore                     macOS     Mac App Store .app codesign
#   mac_installer_distribution   macOS     Mac App Store .pkg signing
#
# REQUIRED SECRETS (repo Settings → Secrets → Actions):
#   MATCH_PASSWORD           — decrypts the Match git repo
#   MATCH_GIT_PRIVATE_KEY    — SSH private key with write access to ios-provisioning-profile
#   APPSTORE_KEY_ID          — App Store Connect API key ID
#   APPSTORE_ISSUER_ID       — App Store Connect API issuer ID
#   APPSTORE_AUTH_KEY        — Contents of AuthKey_<ID>.p8 (base64-encoded)
#
# APP IDENTIFIERS managed by this workflow (space-separated):
#   org.mifos.kmp.template   — kmp-project-template (primary)
#   org.mifospay             — Mifos Pay

on:
  schedule:
    - cron: '0 9 1 * *'      # 1st of every month at 09:00 UTC
  workflow_dispatch:
    inputs:
      force_renewal:
        type: boolean
        default: false
        description: 'Force full renewal even if certs are not near expiry'
      cert_types:
        type: choice
        default: all
        description: 'Which cert types to renew'
        options:
          - all
          - appstore
          - adhoc
          - mac_installer_distribution
      reason:
        description: 'Reason for manual trigger (for audit log)'
        required: false
        default: 'Manual cert renewal'

env:
  APP_IDENTIFIERS: "org.mifos.kmp.template org.mifospay"
  PRIMARY_APP_ID:  "org.mifos.kmp.template"
  MATCH_GIT_URL:   "git@github.com:openMF/ios-provisioning-profile.git"
  MATCH_GIT_BRANCH: "master"

jobs:
  renew-certs:
    name: Renew Signing Certificates
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout kmp-project-template
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Ruby (for bundle exec fastlane)
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.232.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: deployment

      # ── Write secrets to filesystem ──────────────────────────────────────────
      # cert-renewal.sh reads from secrets/match/ and secrets/appstore/ when
      # MATCH_PASSWORD / APPSTORE_* env vars are not set.
      - name: Write secrets
        run: |
          mkdir -p secrets/match secrets/appstore

          printf '%s' "${{ secrets.MATCH_GIT_PRIVATE_KEY }}" > secrets/match/match_ci_key
          chmod 600 secrets/match/match_ci_key

          echo "${{ env.MATCH_GIT_URL }}"    > secrets/match/git_url
          echo "${{ env.MATCH_GIT_BRANCH }}" > secrets/match/git_branch
          printf '%s' "${{ secrets.MATCH_PASSWORD }}" > secrets/match/.match_password
          chmod 600 secrets/match/.match_password

          printf '%s' "${{ secrets.APPSTORE_KEY_ID }}"    > secrets/appstore/key_id
          printf '%s' "${{ secrets.APPSTORE_ISSUER_ID }}" > secrets/appstore/issuer_id
          if echo "${{ secrets.APPSTORE_AUTH_KEY }}" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "${{ secrets.APPSTORE_AUTH_KEY }}" > secrets/appstore/AuthKey.p8
          else
            echo "${{ secrets.APPSTORE_AUTH_KEY }}" | base64 --decode > secrets/appstore/AuthKey.p8
          fi
          chmod 600 secrets/appstore/key_id secrets/appstore/issuer_id secrets/appstore/AuthKey.p8

      # ── Clone ios-provisioning-profile to get canonical cert-renewal.sh ─────
      - name: Fetch cert-renewal.sh from ios-provisioning-profile
        run: |
          GIT_SSH_COMMAND="ssh -i secrets/match/match_ci_key -o StrictHostKeyChecking=no" \
            git clone --depth 1 --single-branch --branch "${{ env.MATCH_GIT_BRANCH }}" \
            "${{ env.MATCH_GIT_URL }}" /tmp/ios-prov-profile
          echo "✅ ios-provisioning-profile cloned to /tmp/ios-prov-profile"

      # ── Run cert renewal using canonical script + kmp bundler context ─────────
      # --fastlane-cmd injects `bundle exec fastlane` from deployment/ (Gemfile + Gemfile.lock).
      # --run-dir points to deployment/ so bundler resolves correctly.
      # The script handles all 4 cert types, expiry check, nuke, recreate, verify.
      - name: Run cert renewal
        env:
          CI: 'true'
          APP_IDENTIFIERS: ${{ env.APP_IDENTIFIERS }}
          PRIMARY_APP_ID:  ${{ env.PRIMARY_APP_ID }}
          MATCH_PASSWORD:  ${{ secrets.MATCH_PASSWORD }}
        run: |
          FORCE="${{ github.event.inputs.force_renewal || 'false' }}"
          TYPE="${{ github.event.inputs.cert_types || 'all' }}"
          REASON="${{ github.event.inputs.reason || 'Scheduled monthly renewal' }}"

          echo "🔄 Reason: $REASON"

          ARGS=(
            "--type" "$TYPE"
            "--git-url"    "${{ env.MATCH_GIT_URL }}"
            "--git-branch" "${{ env.MATCH_GIT_BRANCH }}"
            "--ssh-key"    "$(pwd)/secrets/match/match_ci_key"
            "--fastlane-cmd" "bundle exec fastlane"
            "--run-dir"    "$(pwd)/deployment"
          )
          [[ "$FORCE" == "true" ]] && ARGS+=("--force")

          bash /tmp/ios-prov-profile/cert-renewal.sh "${ARGS[@]}"

      # ── Cleanup ─────────────────────────────────────────────────────────────
      - name: Cleanup secrets
        if: always()
        run: |
          rm -rf secrets/match/.match_password \
                 secrets/match/match_ci_key \
                 secrets/appstore/AuthKey.p8 \
                 secrets/appstore/key_id \
                 secrets/appstore/issuer_id \
                 /tmp/ios-prov-profile

      # ── Failure notice ───────────────────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Certificate renewal failed."
          echo "::error::Run locally: git clone git@github.com:openMF/ios-provisioning-profile.git && cd ios-provisioning-profile && bash cert-renewal.sh --force"
          echo "::error::Full docs: deployment/BOOTSTRAP.md"
